name: phase2b-prebaseline-05

on:
  push:
    branches:
      - validation/phase2b-prebaseline-05

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      BASELINE_HEAD: 39aa1f1d619ad1a4d3b4595d3b3aa6e6e6fdb2ca
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert production identity with integrated Phase2A baseline
        run: |
          test "$(git rev-parse HEAD:src/hitting/physical.py)" = "$(git rev-parse ${BASELINE_HEAD}:src/hitting/physical.py)"
          test "$(git rev-parse HEAD:src/hitting/model.py)" = "$(git rev-parse ${BASELINE_HEAD}:src/hitting/model.py)"
          test "$(git rev-parse HEAD:src/hitting/physical_parameters.py)" = "$(git rev-parse ${BASELINE_HEAD}:src/hitting/physical_parameters.py)"
      - name: Compile validation harness
        run: python -m compileall -q src tools/phase2a_validation_harness.py tools/phase2a_physical_distribution_validation.py tools/phase2b_trajectory_validation.py
      - name: Phase2A integrated offense baseline
        run: |
          mkdir -p reports/phase2b-prebaseline
          python tools/phase2a_validation_harness.py \
            --seed 20260911 --pa 200000 --games 10000 \
            --variance-games 1000 --perf-pa 50000 --perf-games 500 \
            --output reports/phase2b-prebaseline/offense-and-performance.json
      - name: Phase2A physical baseline
        run: |
          python tools/phase2a_physical_distribution_validation.py \
            --seed 20260911 --pa 200000 --sensitivity-n 20000 \
            --output reports/phase2b-prebaseline/physical.json
      - name: Phase2B trajectory adapter readiness
        run: python tools/phase2b_trajectory_validation.py --output reports/phase2b-prebaseline/trajectory-readiness.json
      - name: Phase1 / integration regression
        run: |
          python -m unittest tests.test_phase1_count_situational -v
          python -m unittest tests.test_phase2a_physical_batted_ball -v
          python -m unittest tests.test_production_game_provider tests.test_production_integration_consolidation tests.test_stat_aggregation_advance -v
      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-prebaseline-${{ github.run_id }}-${{ github.sha }}
          path: reports/phase2b-prebaseline
