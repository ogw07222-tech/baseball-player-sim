name: phase2d-candidate-05
on:
  push:
    branches: [validation/phase2d-candidate-05]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
      PR_HEAD: 65d58a6d3cc9aec92258d88908d7ae01c5403c41
      BASE_MAIN: 3a4fc58a3c56d9042561494a08a676762fb4661d
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert production identity with PR65 HEAD
        run: |
          for p in src/hitting/model.py src/hitting/physical.py src/hitting/physical_defense.py src/hitting/defense.py src/hitting/parameters.py src/hitting/baserunning.py; do
            test "$(git rev-parse HEAD:$p)" = "$(git rev-parse ${PR_HEAD}:$p)"
            echo "$p=$(git rev-parse HEAD:$p)"
          done | tee production-blobs.txt
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Phase2D 200k independent corpus
        run: |
          mkdir -p reports/phase2d
          python tools/phase2d_validation_05.py --pa 200000 --seed 20260912 --output reports/phase2d/phase2d.json
      - name: Assert independent structural gates
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/phase2d/phase2d.json'))
          assert x['mirror']['pass']
          m=x['monotonicity']
          assert all(m[k] for k in ['distance_nonincreasing','time_nondecreasing','rating_nondecreasing','direction_order','near_wall_not_easier'])
          assert x['impossible_out']['pass']
          pop=x['opportunity_population']
          assert pop['valid'] > 0 and pop['invalid_rate'] > 0
          assert pop['trajectory_class_valid_rate'].get('ground_like',{}).get('valid',0) == 0
          print('structural gates PASS')
          PY
      - name: Base vs candidate Phase1 and Phase2ABC exact regression
        run: |
          git worktree add --detach /tmp/phase2d-base ${BASE_MAIN}
          cp tools/phase2d_abc_fingerprint.py /tmp/phase2d-base/tools/phase2d_abc_fingerprint.py
          (cd /tmp/phase2d-base && PYTHONPATH=. python tools/phase2d_abc_fingerprint.py --pa 200000 --games 1000 --seed 20260912) > reports/phase2d/base-fingerprint.json
          python tools/phase2d_abc_fingerprint.py --pa 200000 --games 1000 --seed 20260912 > reports/phase2d/candidate-fingerprint.json
          python - <<'PY' | tee reports/phase2d/regression-comparison.json
          import json
          a=json.load(open('reports/phase2d/base-fingerprint.json')); b=json.load(open('reports/phase2d/candidate-fingerprint.json'))
          keys=['bips','pa_results','phase2abc_hash','pa_rng_state','game_totals','game_sequence_hash','game_rng_state']
          eq={k:a[k]==b[k] for k in keys}
          print(json.dumps({'equal':eq,'all_equal':all(eq.values()),'base':a,'candidate':b},sort_keys=True))
          assert all(eq.values())
          PY
      - name: Phase2D targeted and Phase2ABC regressions
        run: |
          python -m unittest tests.test_phase2d_defensive_shadow -v
          python -m unittest tests.test_phase2a_physical_batted_ball tests.test_phase2b_trajectory tests.test_phase2c_stadium_wall tests.test_phase2c_invalid_trajectory -v
          python -m unittest tests.test_production_game_provider tests.test_production_integration_consolidation tests.test_stat_aggregation_advance -v
      - name: Independent determinism replay
        run: |
          python - <<'PY' | tee reports/phase2d/determinism.json
          import json,hashlib
          from src.hitting.model import HitterSnapshot,HittingEngine,PitcherSnapshot
          from src.rng import RNG
          def one():
              rng=RNG(20260912); h=HitterSnapshot(100,100,100,100); p=PitcherSnapshot(100,100,100); d=hashlib.sha256(); n=0
              for _ in range(20000):
                  o=HittingEngine(h,p,100.0,rng).simulate_plate_appearance()
                  if o.batted_ball and o.batted_ball.physical_state:
                      s=o.batted_ball.physical_state; op=s.defensive_opportunity; r=s.defensive_resolution; n+=1
                      d.update(repr((op,r)).encode())
              return n,d.hexdigest(),rng.get_state()
          a=one(); b=one(); out={'first':a,'second':b,'exact_equal':a==b}; print(json.dumps(out,sort_keys=True)); assert a==b
          PY
      - name: Paired same-run Phase2C vs Phase2D performance
        run: |
          cp tools/phase2d_perf_driver.py /tmp/phase2d-base/tools/phase2d_perf_driver.py
          (cd /tmp/phase2d-base && PYTHONPATH=. python tools/phase2d_perf_driver.py --pa 50000 --games 500 --seed 20260912) > reports/phase2d/perf-base.json
          python tools/phase2d_perf_driver.py --pa 50000 --games 500 --seed 20260912 > reports/phase2d/perf-candidate.json
          python - <<'PY' | tee reports/phase2d/performance.json
          import json
          a=json.load(open('reports/phase2d/perf-base.json')); b=json.load(open('reports/phase2d/perf-candidate.json'))
          out={'base':a,'candidate':b,'pa_delta_pct':(b['us_per_pa']/a['us_per_pa']-1)*100,'game_delta_pct':(b['ms_per_game']/a['ms_per_game']-1)*100}
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Full suite context capture
        run: |
          set +e
          python -m unittest discover -s tests > reports/phase2d/full-suite.log 2>&1
          echo $? > reports/phase2d/full-suite-exit.txt
          grep -E '^(FAIL:|ERROR:|FAILED \()' reports/phase2d/full-suite.log || true
          tail -n 20 reports/phase2d/full-suite.log || true
          exit 0
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-candidate-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/phase2d
            production-blobs.txt
