name: phase1-3-0-countdetail

on:
  push:
    branches:
      - validation/phase1-3-0-countdetail

jobs:
  countdetail:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q src tools/count_swing_diagnostic.py tools/count_swing_detail_validation.py
      - run: python tools/count_swing_detail_validation.py
