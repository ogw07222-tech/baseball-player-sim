name: hitter-cpd-speed-contract
on:
  push:
    branches: [feature/hitter-cpd-speed-contract]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tests
        run: pip install pytest
      - name: Contract tests
        run: pytest -q tests/test_hitter_cpd_speed_contract.py
      - name: Full calibration
        run: python -m tools.hitter_contract_v2.calibrate
      - uses: actions/upload-artifact@v4
        with:
          name: hitter-cpd-speed-reports
          path: |
            reports/hitter_cpd_scale_summary.md
            reports/hitter_cpd_before_after.csv
            reports/hitter_cpd_age_curve.csv
            reports/hitter_cpd_normalization_candidates.csv
            reports/hitter_cpd_normalization_final.json
            reports/hitter_cpd_sensitivity.csv
            reports/hitter_cpd_profiles.csv
            reports/hitter_speed_ratio_summary.md
            reports/hitter_speed_grid.csv
            reports/hitter_speed_full_value.csv
            reports/hitter_actual_population_validation.csv
      - name: Publish reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/hitter_cpd_* reports/hitter_speed_* reports/hitter_actual_population_validation.csv
          git diff --cached --quiet || git commit -m "report: publish hitter CPD and speed calibration [skip ci]"
          git push
