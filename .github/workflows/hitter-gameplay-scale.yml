name: hitter-gameplay-scale
on:
  push:
    branches: [feature/hitter-gameplay-normalization]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install tests
        run: pip install pytest
      - name: Normalization unit gates
        run: pytest -q tests/test_hitter_gameplay_normalization.py
      - name: Raw hitter distribution
        run: python -m tools.hitter_gameplay_scale.diagnose --n 30000 --csv reports/hitter_raw_distribution.csv --json reports/hitter_raw_distribution.json
      - name: Ratio and sensitivity Monte Carlo
        run: python -m tools.hitter_gameplay_scale.calibrate
      - name: Apply final gate policy
        run: python -m tools.hitter_gameplay_scale.finalize
      - uses: actions/upload-artifact@v4
        with:
          name: hitter-gameplay-scale-reports
          path: |
            reports/hitter_raw_distribution.csv
            reports/hitter_raw_distribution.json
            reports/hitter_raw_to_gameplay.csv
            reports/hitter_gameplay_sensitivity.csv
            reports/hitter_profile_validation.csv
            reports/hitter_gameplay_scale_candidates.csv
            reports/hitter_extreme_safety.csv
            reports/hitter_gameplay_scale_final.json
            reports/hitter_gameplay_scale_summary.md
      - name: Publish calibration reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/hitter_raw_distribution.csv reports/hitter_raw_distribution.json reports/hitter_raw_to_gameplay.csv reports/hitter_gameplay_sensitivity.csv reports/hitter_profile_validation.csv reports/hitter_gameplay_scale_candidates.csv reports/hitter_extreme_safety.csv reports/hitter_gameplay_scale_final.json reports/hitter_gameplay_scale_summary.md
          git diff --cached --quiet && exit 0
          git commit -m "report: publish hitter gameplay scale calibration [skip ci]"
          git push origin HEAD:feature/hitter-gameplay-normalization
