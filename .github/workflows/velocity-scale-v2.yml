name: velocity-scale-v2
on:
  push:
    branches: [feature/velocity-scale-v2-calibration]
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run baseline population diagnostic
        run: python -m tools.velocity_scale_v2.diagnose --snapshots 120000 --careers 12000 --seed 20260906 --output reports/velocity_v2_baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: velocity-v2-baseline
          path: reports/velocity_v2_baseline.json
