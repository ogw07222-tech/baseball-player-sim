name: pitcher-v4-jacobian
on:
  push:
    branches: [feature/overnight-hitter-pitcher-calibration]
    paths:
      - reports/pitcher_joint_v4_final.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  jacobian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Residual and local Jacobian diagnostic
        run: python -m tools.pitcher_joint_v4.jacobian
      - uses: actions/upload-artifact@v4
        with:
          name: pitcher-v4-jacobian
          path: |
            reports/pitcher_joint_v4_jacobian.csv
            reports/pitcher_joint_v4_residual_analysis.csv
            reports/pitcher_joint_v4_jacobian_summary.json
      - name: Publish diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin feature/overnight-hitter-pitcher-calibration
          git add reports/pitcher_joint_v4_jacobian.csv reports/pitcher_joint_v4_residual_analysis.csv reports/pitcher_joint_v4_jacobian_summary.json
          git diff --cached --quiet || git commit -m "report: publish Pitcher v4 residual/Jacobian analysis [skip ci]"
          git push
