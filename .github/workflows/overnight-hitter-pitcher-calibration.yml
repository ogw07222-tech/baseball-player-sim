name: overnight-hitter-pitcher-calibration
on:
  push:
    branches: [feature/overnight-hitter-pitcher-calibration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-a-hitter-cpd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Recenter invariants
        run: pytest -q tests/test_hitter_cpd_recenter.py tests/test_hitter_gameplay_normalization.py
      - name: 30k before-after age curve
        run: python -m tools.overnight_calibration.hitter_cpd --n 30000
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-hitter-cpd
          path: |
            reports/hitter_cpd_*.csv
            reports/hitter_cpd_*.json
            reports/hitter_cpd_*.md
  stage-b-hitter-normalization:
    runs-on: ubuntu-latest
    needs: stage-a-hitter-cpd
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Normalization tests
        run: pytest -q tests/test_hitter_gameplay_normalization.py tests/test_hitter_cpd_recenter.py
      - name: Multi-seed C/P/D normalization
        run: python -m tools.overnight_calibration.hitter_normalization_v2
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-hitter-normalization
          path: |
            reports/hitter_cpd_normalization_*.csv
            reports/hitter_cpd_normalization_*.json
            reports/hitter_cpd_sensitivity.csv
            reports/hitter_cpd_raw_to_gameplay.csv
            reports/hitter_actual_population_validation.csv
  stage-c-speed:
    runs-on: ubuntu-latest
    needs: stage-b-hitter-normalization
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Speed path tests
        run: pytest -q tests/test_hitter_speed_ratio.py
      - name: Full Speed value grid
        run: python -m tools.overnight_calibration.speed_ratio
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-speed-ratio
          path: |
            reports/hitter_speed_*.csv
            reports/hitter_speed_*.json
            reports/hitter_speed_*.md
  stage-d-pitcher-joint-v4:
    runs-on: ubuntu-latest
    needs: stage-c-speed
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Hitter contract gate
        run: |
          python - <<'PY'
          import json
          p='reports/hitter_display_gameplay_contract_final.json'
          d=json.load(open(p))
          assert d['gate']=='HITTER_DISPLAY_GAMEPLAY_CONTRACT_READY', d
          PY
      - name: Frozen-path regression tests
        run: pytest -q tests/test_hitter_production_normalization.py tests/test_hitter_gameplay_normalization.py tests/test_hitter_speed_ratio.py tests/test_pitcher_scb_scale.py tests/test_physical_velocity.py
      - name: Pitcher Joint v4 search and validation
        run: python -m tools.pitcher_joint_v4.calibrate --hitters 2000 --pitchers 2000 --candidates 60 --search-pa 100000 --validation-pa 1000000 --top 5 --seeds 5 --diag-pa 300000 --seed 260907
      - uses: actions/upload-artifact@v4
        with:
          name: pitcher-joint-v4
          path: |
            reports/pitcher_joint_v4_*.csv
            reports/pitcher_joint_v4_*.json
            reports/pitcher_joint_v4_*.md
      - name: Publish final calibration reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin feature/overnight-hitter-pitcher-calibration
          git add reports/hitter_cpd_* reports/hitter_actual_population_validation*.csv reports/hitter_speed_* reports/hitter_display_gameplay_contract_final.json reports/pitcher_joint_v4_*
          git diff --cached --quiet || git commit -m "report: publish hitter contract and pitcher joint v4 calibration [skip ci]"
          git push
