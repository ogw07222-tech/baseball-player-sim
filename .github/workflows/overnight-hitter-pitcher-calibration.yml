name: overnight-hitter-pitcher-calibration
on:
  push:
    branches: [feature/overnight-hitter-pitcher-calibration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-a-hitter-cpd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Recenter invariants
        run: pytest -q tests/test_hitter_cpd_recenter.py tests/test_hitter_gameplay_normalization.py
      - name: 30k before-after age curve
        run: python -m tools.overnight_calibration.hitter_cpd --n 30000
      - uses: actions/upload-artifact@v4
        with:
          name: overnight-hitter-cpd
          path: |
            reports/hitter_cpd_*.csv
            reports/hitter_cpd_*.json
            reports/hitter_cpd_*.md
      - name: Publish Stage A reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/hitter_cpd_*
          git diff --cached --quiet || git commit -m "report: publish hitter C/P/D recenter diagnostic [skip ci]"
          git push
