name: heavy-validation
# one-time offense diagnostic retry

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite to run
        required: true
        default: full_game
        type: choice
        options:
          - full_game
          - pitcher_usage
          - catcher_generation
          - offense_diag
          - all
      seed:
        description: RNG seed
        required: true
        default: '20260906'
        type: string
      games:
        description: Full-game sample size
        required: true
        default: '10000'
        type: string
      seasons:
        description: Pitcher-usage season sample size
        required: true
        default: '500'
        type: string
      samples:
        description: Catcher/pitch diagnostic sample size
        required: true
        default: '200000'
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/heavy-validation.yml']

jobs:
  heavy-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'offense_diag' }}
      SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '20260906' }}
      GAMES: ${{ github.event_name == 'workflow_dispatch' && inputs.games || '10000' }}
      SEASONS: ${{ github.event_name == 'workflow_dispatch' && inputs.seasons || '500' }}
      SAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.samples || '200000' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record validation metadata
        run: |
          mkdir -p reports/integration-local
          printf '{"sha":"%s","run_id":"%s","suite":"%s","seed":"%s","games":"%s","seasons":"%s","samples":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SUITE" "$SEED" "$GAMES" "$SEASONS" "$SAMPLES" > reports/integration-local/metadata.json
          cat reports/integration-local/metadata.json
      - name: Compile validation dependencies
        run: python -m compileall -q src tools/production_game_provider_sanity.py tools/pitcher_usage_sanity.py tools/catcher_generation_sanity.py tools/offense_pitch_diagnostic.py
      - name: Canonical full-game production sanity
        if: env.SUITE == 'full_game' || env.SUITE == 'all'
        run: python tools/production_game_provider_sanity.py --games "$GAMES" --seed "$SEED" --output reports/integration-local/full-game.json
      - name: Pitcher usage heavy sanity
        if: env.SUITE == 'pitcher_usage' || env.SUITE == 'all'
        run: python tools/pitcher_usage_sanity.py --seasons "$SEASONS" --seed "$SEED" > reports/integration-local/pitcher-usage.json
      - name: Catcher generation heavy sanity
        if: env.SUITE == 'catcher_generation' || env.SUITE == 'all'
        run: python tools/catcher_generation_sanity.py --samples "$SAMPLES" --seed "$SEED" > reports/integration-local/catcher-generation.json
      - name: Expanded offensive and pitch diagnostic
        if: env.SUITE == 'offense_diag' || env.SUITE == 'all'
        run: python tools/offense_pitch_diagnostic.py --games "$GAMES" --pa-samples "$SAMPLES" --seed "$SEED" --output reports/integration-local/offense-pitch-diagnostic.json
      - name: Upload heavy validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-validation-${{ github.run_id }}-${{ github.sha }}
          path: reports/integration-local/
          if-no-files-found: error
          retention-days: 30
