name: tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/baseball_sim_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseball_sim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseball_sim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -r requirements-api.txt
      - name: Compile
        run: python -m compileall -q index.py src tests tools/draft_calibration.py tools/deployed_p0_smoke.py
      - name: External durable store tests
        run: python -m unittest tests.test_postgres_session_store tests.test_api_production_config -v
      - name: Vercel FastAPI entrypoint smoke
        env:
          BASEBALL_SIM_PRODUCTION: '1'
        run: python -c "from index import app; assert app.title == 'Baseball Player Simulator API'"
      - name: API vertical-slice tests
        run: python -m unittest tests.test_api_vertical_slice -v
      - name: Related production integration tests
        run: python -m unittest tests.test_production_game_provider tests.test_production_integration_consolidation tests.test_season_lifecycle_bridge -v
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Auto career smoke
        run: python -m src.main --seed 20260903 --auto --name "CI Smoke" --position SS --bats-throws R/R --traits 3
      - name: Balance smoke
        run: python -m src.balance --samples 100 --careers 20 --coach-samples 20 --event-samples 100 --seed 20260903
      - name: High-school / draft calibration gate
        run: python -m tools.draft_calibration --players 10000 --npcs 10000 --drafts 10000 --seed 20260905 --output draft-calibration.json
      - name: Upload draft calibration report
        uses: actions/upload-artifact@v4
        with:
          name: draft-calibration
          path: draft-calibration.json

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
