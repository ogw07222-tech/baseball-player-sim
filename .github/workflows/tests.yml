name: tests

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Auto career smoke
        run: python -m src.main --seed 20260903 --auto --name "CI Smoke" --position SS --bats-throws R/R --traits 3
      - name: Balance smoke
        run: python -m src.balance --samples 100 --careers 20 --coach-samples 20 --event-samples 100 --seed 20260903
