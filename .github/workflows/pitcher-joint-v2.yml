name: pitcher-joint-v2
on:
  push:
    branches: [feature/pitcher-joint-calibration-v2]
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prime raw diagnostic
        run: python -m tools.pitcher_joint_v2.prime_diagnostic --n 30000 --output reports/pitcher_prime_raw_diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: pitcher-joint-v2-diagnostic
          path: reports/pitcher_prime_raw_diagnostic.json
