name: phase2c-revalidate-05
on:
  push:
    branches: [validation/phase2c-revalidate-05]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
      PR61_HEAD: d0951ad8d2873edaa4f88e8aa41cd78d550ac1cd
      FAILED_HEAD: b3dd53e7fbb82a75b3586240a35fe4d59c381a7b
      PRE2C: 9d406589d6c71a92fa91843047116200c12826b3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert production identity with current PR61 HEAD
        run: |
          for p in src/hitting/stadium.py src/hitting/trajectory.py src/hitting/physical.py src/hitting/model.py src/hitting/physical_parameters.py src/hitting/trajectory_parameters.py; do
            test "$(git rev-parse HEAD:$p)" = "$(git rev-parse ${PR61_HEAD}:$p)"
            echo "$p=$(git rev-parse HEAD:$p)"
          done | tee production-blobs.txt
      - name: Assert fix production diff scope
        run: |
          test "$(git diff --name-only ${FAILED_HEAD} ${PR61_HEAD} -- src | tr '\n' ' ')" = "src/hitting/stadium.py "
          git diff --stat ${FAILED_HEAD} ${PR61_HEAD} -- src | tee fix-production-diff.txt
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Stadium and HR-shadow corpus
        run: |
          mkdir -p reports/phase2c-revalidate
          python tools/phase2c_candidate_validation.py --seed 20260911 --pa 200000 --output reports/phase2c-revalidate/stadium-shadow.json
      - name: Assert impossible-HR pack including exact blocker
        run: |
          python - <<'PY' | tee reports/phase2c-revalidate/blocker-retest.json
          import json
          from src.hitting.stadium import QUALITY_APPROXIMATED, StadiumGeometry, resolve_wall_interaction
          from src.hitting.trajectory import BattedBallTrajectory
          d=json.load(open('reports/phase2c-revalidate/stadium-shadow.json'))
          imp=d['impossible']
          assert imp['hr_without_wall_reach'] is False, imp
          assert imp['hr_below_wall'] is False, imp
          assert imp['invalid_trajectory_hr'] is False, imp
          assert imp['negative_radius_rejected'] is True, imp
          assert imp['nonfinite_geometry_rejected'] is True, imp
          t=BattedBallTrajectory(horizontal_distance_ft=430.0,hang_time_s=5.0,apex_height_ft=110.0,landing_x_ft=0.0,landing_y_ft=430.0,trajectory_class='fly_ball',apex_distance_fraction=0.5,valid=False)
          s=StadiumGeometry(stadium_id='exact_failed_probe',season=None,is_real_stadium=False,source_quality=QUALITY_APPROXIMATED,wall_radius_ft=(350.0,)*5,wall_height_ft=(8.0,)*5)
          w=resolve_wall_interaction(trajectory=t,spray_angle_deg=0.0,is_fair_shadow=True,stadium=s)
          out={'physical_hr_shadow':w.physical_hr_shadow,'reaches_wall':w.reaches_wall,'clears_wall':w.clears_wall,'wall_contact':w.wall_contact,'ball_height_at_wall_ft':w.ball_height_at_wall_ft,'clearance_ft':w.clearance_ft,'impossible_pack':imp}
          assert out['physical_hr_shadow'] is False
          assert out['reaches_wall'] is False
          assert out['clears_wall'] is False
          assert out['wall_contact'] is False
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Phase1 fixed-seed regression
        run: python tools/offense_pitch_diagnostic.py --seed 20260911 --games 10000 --pa-samples 200000 --output reports/phase2c-revalidate/offense.json
      - name: Phase2A physical regression
        run: python tools/phase2a_physical_distribution_validation.py --seed 20260911 --pa 200000 --sensitivity-n 20000 --output reports/phase2c-revalidate/physical.json
      - name: Phase2B trajectory regression
        run: python tools/phase2b_candidate_validation.py --seed 20260911 --pa 200000 --output reports/phase2c-revalidate/trajectory.json
      - name: Targeted Phase2C tests
        run: python -m unittest tests.test_phase2c_stadium_wall tests.test_phase2c_invalid_trajectory -v
      - name: Phase1 Phase2A Phase2B targeted regressions
        run: python -m unittest tests.test_phase1_count_situational tests.test_phase2a_physical_batted_ball tests.test_phase2b_trajectory -v
      - name: Deterministic 250-game replay
        run: |
          python - <<'PY' | tee reports/phase2c-revalidate/determinism.json
          import json
          from datetime import date,timedelta
          from src.game_provider import GameFixture,ProductionGameProvider
          from src.rng import RNG
          def run():
              rng=RNG(20260911); p=ProductionGameProvider(notable_event_limit=8); out=[]
              for i in range(250):
                  g=p.run_game(GameFixture(date(2026,4,1)+timedelta(days=i),'A','H'),rng)
                  out.append((g.away_score,g.home_score,g.innings_played,len(g.notable_events)))
              return out,rng.get_state()
          a,ar=run(); b,br=run(); r={'games':250,'game_sequence_exact_equal':a==b,'rng_state_exact_equal':ar==br}; assert all([r['game_sequence_exact_equal'],r['rng_state_exact_equal']]); print(json.dumps(r,sort_keys=True))
          PY
      - name: Paired same-run Phase2B vs fixed Phase2C performance
        run: |
          git worktree add --detach /tmp/pre2c ${PRE2C}
          cp tools/phase2c_perf_driver.py /tmp/pre2c/tools/phase2c_perf_driver.py
          (cd /tmp/pre2c && PYTHONPATH=. python tools/phase2c_perf_driver.py --pa 50000 --games 500 --seed 20260911) > reports/phase2c-revalidate/perf-pre2c.json
          python tools/phase2c_perf_driver.py --pa 50000 --games 500 --seed 20260911 > reports/phase2c-revalidate/perf-candidate.json
          python - <<'PY' | tee reports/phase2c-revalidate/performance.json
          import json
          a=json.load(open('reports/phase2c-revalidate/perf-pre2c.json')); b=json.load(open('reports/phase2c-revalidate/perf-candidate.json'))
          print(json.dumps({'pre2c':a,'candidate':b,'pa_delta_pct':(b['us_per_pa']/a['us_per_pa']-1)*100,'game_delta_pct':(b['ms_per_game']/a['ms_per_game']-1)*100},sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-revalidate-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/phase2c-revalidate
            production-blobs.txt
            fix-production-diff.txt
