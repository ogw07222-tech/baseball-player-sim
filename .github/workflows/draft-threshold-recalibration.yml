name: draft-threshold-recalibration
on:
  push:
    branches: [feature/overnight-hitter-pitcher-calibration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate 10k score distribution and search threshold shift
        run: python -m tools.overnight_calibration.draft_threshold_recalibration
      - uses: actions/upload-artifact@v4
        with:
          name: draft-threshold-recalibration
          path: reports/draft_threshold_recalibration_*
      - name: Publish reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin feature/overnight-hitter-pitcher-calibration
          git add reports/draft_threshold_recalibration_*
          git diff --cached --quiet || git commit -m "report: publish downstream draft threshold recalibration [skip ci]"
          git push
