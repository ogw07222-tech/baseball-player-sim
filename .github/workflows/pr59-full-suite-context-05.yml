name: pr59-full-suite-context-05

on:
  push:
    branches:
      - validation/pr59-current-head-05

jobs:
  full-suite:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/baseball_sim_test
      PYTHONPATH: .
      PR59_HEAD: 26ef621342a92b190000d0784fc39874407f052e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baseball_sim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baseball_sim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert production identity
        run: |
          test "$(git rev-parse HEAD:src/hitting/physical.py)" = "$(git rev-parse ${PR59_HEAD}:src/hitting/physical.py)"
          test "$(git rev-parse HEAD:src/hitting/model.py)" = "$(git rev-parse ${PR59_HEAD}:src/hitting/model.py)"
          test "$(git rev-parse HEAD:src/hitting/physical_parameters.py)" = "$(git rev-parse ${PR59_HEAD}:src/hitting/physical_parameters.py)"
      - name: Install API dependencies
        run: pip install -r requirements-api.txt
      - name: Compile
        run: python -m compileall -q index.py src tests
      - name: Full repository suite context
        shell: bash
        run: |
          mkdir -p reports/pr59-full-suite
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee reports/pr59-full-suite/full-suite.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee reports/pr59-full-suite/full-suite-exit-code.txt
          exit 0
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pr59-full-suite-context-${{ github.run_id }}-${{ github.sha }}
          path: reports/pr59-full-suite
