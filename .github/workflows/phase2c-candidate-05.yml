name: phase2c-candidate-05
on:
  push:
    branches: [validation/phase2c-candidate-05]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .
      PR61_HEAD: b3dd53e7fbb82a75b3586240a35fe4d59c381a7b
      PRE2C: 9d406589d6c71a92fa91843047116200c12826b3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Assert production identity with PR61 HEAD
        run: |
          for p in src/hitting/stadium.py src/hitting/trajectory.py src/hitting/physical.py src/hitting/model.py src/hitting/physical_parameters.py src/hitting/trajectory_parameters.py; do
            test "$(git rev-parse HEAD:$p)" = "$(git rev-parse ${PR61_HEAD}:$p)"
            echo "$p=$(git rev-parse HEAD:$p)"
          done | tee production-blobs.txt
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Stadium and HR-shadow corpus
        run: |
          mkdir -p reports/phase2c
          python tools/phase2c_candidate_validation.py --seed 20260911 --pa 200000 --output reports/phase2c/stadium-shadow.json
      - name: Phase1 final outcome regression
        run: python tools/offense_pitch_diagnostic.py --seed 20260911 --games 10000 --pa-samples 200000 --output reports/phase2c/offense.json
      - name: Phase2A physical regression
        run: python tools/phase2a_physical_distribution_validation.py --seed 20260911 --pa 200000 --sensitivity-n 20000 --output reports/phase2c/physical.json
      - name: Phase2B trajectory regression
        run: python tools/phase2b_candidate_validation.py --seed 20260911 --pa 200000 --output reports/phase2c/trajectory.json
      - name: Targeted Phase2C tests
        run: python -m unittest tests.test_phase2c_stadium_wall -v
      - name: Phase1 Phase2A Phase2B regressions
        run: python -m unittest tests.test_phase1_count_situational tests.test_phase2a_physical_batted_ball tests.test_phase2b_trajectory -v
      - name: Production integration regressions
        run: python -m unittest tests.test_production_game_provider tests.test_production_integration_consolidation tests.test_stat_aggregation_advance -v
      - name: Deterministic full-game replay
        run: |
          python - <<'PY' | tee reports/phase2c/determinism.json
          import json
          from datetime import date,timedelta
          from src.game_provider import GameFixture,ProductionGameProvider
          from src.rng import RNG
          def run():
              rng=RNG(20260911); p=ProductionGameProvider(notable_event_limit=8); out=[]
              for i in range(250):
                  g=p.run_game(GameFixture(date(2026,4,1)+timedelta(days=i),'A','H'),rng)
                  out.append((g.away_score,g.home_score,g.innings_played,len(g.notable_events)))
              return out,rng.get_state()
          a,ar=run(); b,br=run(); print(json.dumps({'games':250,'game_sequence_exact_equal':a==b,'rng_state_exact_equal':ar==br},sort_keys=True))
          PY
      - name: Paired same-run Phase2B vs Phase2C performance
        run: |
          git worktree add --detach /tmp/pre2c ${PRE2C}
          cp tools/phase2c_perf_driver.py /tmp/pre2c/tools/phase2c_perf_driver.py
          (cd /tmp/pre2c && PYTHONPATH=. python tools/phase2c_perf_driver.py --pa 50000 --games 500 --seed 20260911) > reports/phase2c/perf-pre2c.json
          python tools/phase2c_perf_driver.py --pa 50000 --games 500 --seed 20260911 > reports/phase2c/perf-candidate.json
          python - <<'PY' | tee reports/phase2c/performance.json
          import json
          a=json.load(open('reports/phase2c/perf-pre2c.json')); b=json.load(open('reports/phase2c/perf-candidate.json'))
          print(json.dumps({'pre2c':a,'candidate':b,'pa_delta_pct':(b['us_per_pa']/a['us_per_pa']-1)*100,'game_delta_pct':(b['ms_per_game']/a['ms_per_game']-1)*100},sort_keys=True))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2c-candidate-${{ github.run_id }}-${{ github.sha }}
          path: |
            reports/phase2c
            production-blobs.txt
