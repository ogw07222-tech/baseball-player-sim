name: hitter-final-contract
on:
  push:
    branches: [feature/overnight-hitter-pitcher-calibration]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - name: Hitter contract tests
        run: pytest -q tests/test_hitter_cpd_recenter.py tests/test_hitter_gameplay_normalization.py tests/test_hitter_speed_ratio.py
      - name: Final integrated 3M PA validation
        run: python -m tools.overnight_calibration.hitter_final_validation
      - uses: actions/upload-artifact@v4
        with:
          name: hitter-final-contract
          path: |
            reports/hitter_display_gameplay_contract_final.json
            reports/hitter_actual_population_validation_final.csv
            reports/hitter_speed_final_grid.csv
      - name: Publish final hitter reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin feature/overnight-hitter-pitcher-calibration
          git add reports/hitter_display_gameplay_contract_final.json reports/hitter_actual_population_validation_final.csv reports/hitter_speed_final_grid.csv
          git diff --cached --quiet || git commit -m "report: publish final hitter display-gameplay contract [skip ci]"
          git push
