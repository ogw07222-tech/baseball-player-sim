[project]
name = "baseball-player-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "src.api.app:app"

[tool.vercel.scripts]
build = "npm --prefix web ci && npm --prefix web run build"
